<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0a0d;
        overflow: hidden;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      .game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .game-canvas[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
